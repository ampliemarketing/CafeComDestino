server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota (inclusive /pedir, o cardápio público) cai no index.html;
    # o React lê window.location.pathname e decide o que renderizar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome — cache agressivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache (senão o deploy novo não aparece).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
